<!doctype html>
<html><head><meta charset="utf-8">
<!-- GRAPHICS LAYER. Copy to the job folder as overlay.html, then edit the THEME, BACKTEXT, HEADLINE and BEATS sections.
     Every draw(t) must depend only on t (and the frame number), so frames render the same every time. -->
<style>
@font-face{font-family:IT;src:url(fonts/inter-tight/files/inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IT;src:url(fonts/inter-tight/files/inter-tight-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:IT;src:url(fonts/inter-tight/files/inter-tight-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IT;src:url(fonts/inter-tight/files/inter-tight-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:IS;src:url(fonts/instrument-serif/files/instrument-serif-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:JB;src:url(fonts/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2);font-weight:500}
/* other scripts: Malayalam, Hindi/Marathi (Devanagari), Tamil, Arabic */
@font-face{font-family:LOC;src:url(fonts/anek-malayalam/files/anek-malayalam-malayalam-700-normal.woff2);font-weight:700}
@font-face{font-family:LOC;src:url(fonts/anek-malayalam/files/anek-malayalam-malayalam-800-normal.woff2);font-weight:800}
@font-face{font-family:LOC;src:url(fonts/noto-sans-devanagari/files/noto-sans-devanagari-devanagari-700-normal.woff2);font-weight:700 800}
@font-face{font-family:LOC;src:url(fonts/noto-sans-tamil/files/noto-sans-tamil-tamil-700-normal.woff2);font-weight:700 800}
@font-face{font-family:LOC;src:url(fonts/noto-sans-arabic/files/noto-sans-arabic-arabic-700-normal.woff2);font-weight:700 800}
/* ===== THEME (change these) ===== */
:root{--txt:#F5F2EC;--mut:#8C9A88;--dim:#5B6658;--acc:#C6F432;--accrgb:198,244,50;--card:#0F1511;--line2:rgba(255,255,255,.16)}  /* Euphoria look: green-black + lime */
html,body{margin:0;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:IT,LOC,sans-serif;-webkit-font-smoothing:antialiased;color:var(--txt)}
.abs{position:absolute}.layer{position:absolute;inset:0;display:none}
#card{position:absolute;inset:0;display:none;background:url(bg.png) center/cover}
#pipf{position:absolute;display:none;box-sizing:border-box}
#shade{position:absolute;left:0;right:0;top:960px;height:960px;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.30) 35%,rgba(0,0,0,.62) 100%)}
#tshade{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(to top,rgba(0,0,0,0),rgba(0,0,0,.42))}
#cap{position:absolute;left:0;top:0;width:1080px;display:flex;justify-content:center}
#capin{display:inline-flex;flex-direction:column;transform-origin:center center}
.row{display:block;white-space:nowrap;line-height:1.02}.row.pre{text-align:left}.row.post{text-align:right}.row.mid{text-align:center}
.w{display:inline-block;margin:0 .12em;text-shadow:0 4px 20px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.45)}
.sm{font:700 50px IT,LOC}.bg{font:800 112px IT,LOC;letter-spacing:-0.02em}.bg.serif{font:italic 400 150px IS,LOC}.bg.loc{font:800 104px LOC,IT}
.in{font:700 60px IT,LOC}.in.big{font:800 70px IT,LOC}.in.big.serif{font:italic 400 86px IS,LOC}
.pillcap{background:rgba(12,12,14,.82);border-radius:22px;padding:10px 20px 14px}
.pillcap .w{font:800 62px IT,LOC;text-shadow:none;border-radius:12px;padding:0 8px}
.acc{color:var(--acc)}
#hl{position:absolute;left:0;right:0;top:236px;text-align:center;font:700 56px IT,LOC;letter-spacing:-0.01em;text-shadow:0 3px 18px rgba(0,0,0,.5)}
#back{position:absolute;inset:0;display:none}
.giant{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:44px;padding:12px 26px;font:700 32px IT,LOC;white-space:nowrap}
.glass{background:rgba(24,24,28,.92);border:1.5px solid var(--line2);border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.block{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 70px}
.block .big{font:800 150px/0.95 IT,LOC;letter-spacing:-0.04em}
.block .sub{font:700 48px IT,LOC;margin-top:28px;opacity:.85}
.sticker{position:absolute;font:800 44px IT,LOC;padding:10px 24px;border-radius:14px;background:var(--acc);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style></head><body>
<div id="stage">
  <div id="back"></div>
  <div id="card"></div>
  <div id="pipf"></div>
  <div id="shade"></div>
  <div id="tshade"></div>
  <div id="layers"></div>
  <div id="hl"></div>
  <div id="cap"><div id="capin"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const C=x=>Math.max(0,Math.min(1,x)), P=(t,a,d)=>C((t-a)/d), lerp=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=(x,s=1.6)=>{x=C(x);const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const EASE={eo,eo5,eio,eb,lin:x=>x};
const show=(el,v)=>{if(el)el.style.display=v?'block':'none'};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pop=(t,tk,d=0.34)=>[eb(P(t,tk,d)),C(P(t,tk,d)*2.6)];           // [scale, opacity] for a pop-in at time tk
const ent=(t,tk,d=0.3)=>eo5(P(t,tk,d));                              // 0..1 smooth entrance
function setT(el,o,tr,blur){el.style.opacity=o;el.style.transform=tr||'';el.style.filter=blur?`blur(${blur}px)`:''}
function add(parent,html){const d=document.createElement('div');d.innerHTML=html.trim();const el=d.firstChild;$(parent).appendChild(el);return el}
let CFG={},SUBS=[],cur=-1,curMode='',FR=0;

/* ================= EDIT THESE ================= */
// Text behind the person (needs masks + "back" ranges in overlay_cfg.json). top = px from the top of the frame.
const BACKTEXT=[
  // {t0:0, t1:4.2, text:'Claude', top:318, size:300, color:'#F7F2EA', glowAt:3.6}
];
// Headline at the top of the first seconds (the hook). '' = none.
const HEADLINE={text:'', until:4.2};
// Caption placement over time: mode 'st' = stacked (big key word), 'in' = one line, 'pill' = dark pill with the spoken word highlighted
function capStyle(t){
  // e.g. if(t>=13.6&&t<23.4) return {m:'in',y:1052};
  return {m:'st',y:1290};
}
// Beats: each {layer:'id' | card:'id', t0, t1, build(), draw(t)}. card = full-screen background (bg.png) behind it.
const BEATS=[
  // see SKILL.md "Beat recipes" and examples/*.html
];
/* ============================================== */

// ---------- layouts (pip.json, shared with composite.py) ----------
function pipAt(t){const K=CFG.pip.keys,S=CFG.pip.states;let i=0;for(let j=0;j<K.length;j++)if(K[j][0]<=t)i=j;
  if(i>=K.length-1)return{s:S[K[i][1]],name:K[i][1]};const a=K[i],b=K[i+1];
  if(b[2]==='step'||b[0]===a[0]||a[1]===b[1])return{s:S[a[1]],name:a[1]};
  const u=(EASE[b[2]||'eio'])((t-a[0])/(b[0]-a[0]));return{s:S[a[1]].map((v,k)=>v+(S[b[1]][k]-v)*u),name:a[1]+'>'+b[1],u}}
const isFull=s=>s[0]<0.5&&s[1]<0.5&&s[2]>1079&&s[3]>1919;
function drawPip(t){const p=pipAt(t),s=p.s,el=$('pipf');if(isFull(s)){show(el,0);return p}
  show(el,1);const[x,y,w,h,r]=s;let ph=0;if(/^phone/.test(p.name)&&!/>(?!phone)/.test(p.name))ph=1;else if(/^phone.*>/.test(p.name))ph=1-p.u;
  const bw=13*ph;Object.assign(el.style,{left:(x-bw)+'px',top:(y-bw)+'px',width:(w+2*bw)+'px',height:(h+2*bw)+'px',borderRadius:(r+bw)+'px',
  border:bw>0.5?`${bw}px solid #1a1a1e`:'1.5px solid rgba(255,255,255,.14)',
  boxShadow:ph>0?`0 0 0 1.5px rgba(255,255,255,.18),0 0 140px rgba(var(--accrgb),${.32*ph}),0 40px 80px rgba(0,0,0,.6)`:'0 30px 70px rgba(0,0,0,.55)'});return p}

// ---------- captions ----------
const isLoc=s=>/[ऀ-෿؀-ۿ]/.test(s.replace(/-.*$/,''));
function buildCap(ch,mode){const inn=$('capin');inn.innerHTML='';inn.style.transform='none';inn.className='';
  const W=ch.w.map((w,i)=>({...w,i}));const mk=(w,cls)=>`<span class="w ${cls}${w.a&&mode!=='pill'?' acc':''}" data-i="${w.i}">${w.x}</span>`;
  const big=W.filter(w=>w.big).map(w=>w.i);
  if(mode==='pill'){inn.className='pillcap';inn.innerHTML=`<div class="row mid">${W.map(w=>mk(w,'')).join('')}</div>`}
  else if(mode==='st'&&big.length){const b0=Math.min(...big),b1=Math.max(...big);const pre=W.filter(w=>w.i<b0),mid=W.filter(w=>w.i>=b0&&w.i<=b1),post=W.filter(w=>w.i>b1);
    inn.innerHTML=(pre.length?`<div class="row pre">${pre.map(w=>mk(w,'sm')).join('')}</div>`:'')+`<div class="row mid">${mid.map(w=>mk(w,'bg'+(w.serif&&!isLoc(w.x)?' serif':(isLoc(w.x)?' loc':'')))).join('')}</div>`+(post.length?`<div class="row post">${post.map(w=>mk(w,'sm')).join('')}</div>`:'')}
  else if(mode==='st'){inn.innerHTML=`<div class="row mid">${W.map(w=>mk(w,'in big')).join('')}</div>`}
  else{inn.innerHTML=`<div class="row mid">${W.map(w=>mk(w,'in'+(w.big?' big':'')+(w.big&&w.serif&&!isLoc(w.x)?' serif':''))).join('')}</div>`}
  const r=inn.getBoundingClientRect();inn.dataset.sc=Math.min(1,980/r.width);inn.dataset.h=r.height}
function setCap(t){let k=SUBS.findIndex(s=>t>=s.s&&t<s.e);const st=capStyle(t),cap=$('cap'),inn=$('capin');
  if(k!==cur||st.m!==curMode){cur=k;curMode=st.m;if(k>=0)buildCap(SUBS[k],st.m);else{inn.innerHTML='';inn.className=''}}
  if(k<0||st.m==='none'){cap.style.display=st.m==='none'?'none':'flex';return}cap.style.display='flex';
  const sc=+inn.dataset.sc,h=+inn.dataset.h;cap.style.top=(st.y-h/2)+'px';const ch=SUBS[k];const cin=eo(P(t,ch.s,0.14));
  inn.style.transform=`scale(${sc*(0.96+0.04*cin)})`;
  inn.querySelectorAll('.w').forEach(sp=>{const w=ch.w[+sp.dataset.i];const tk=+sp.dataset.i?w.t-0.05:ch.s;
    if(st.m==='pill'){const on=t>=tk;const nx=ch.w[+sp.dataset.i+1];const active=on&&(!nx||t<nx.t-0.05);
      sp.style.opacity=on?1:0.35;sp.style.background=active?'var(--acc)':'transparent';sp.style.color=active?'#0B0F0A':(w.a?'var(--acc)':'#fff');return}
    const p=eo(P(t,tk,0.16));const isBig=sp.classList.contains('bg')||sp.classList.contains('big');const s=isBig?0.72+0.28*eb(P(t,tk,0.3)):0.9+0.1*p;
    sp.style.opacity=p;sp.style.filter=p<1?`blur(${(1-p)*9}px)`:'';sp.style.transform=`translateY(${(1-p)*18}px) scale(${s})`;
    if(isBig){const gl=1-C(P(t,tk+0.15,0.6));sp.style.textShadow=w.a?`0 0 ${20+26*gl}px rgba(var(--accrgb),${0.55+0.3*gl}),0 4px 20px rgba(0,0,0,.5)`:`0 0 ${20+26*gl}px rgba(255,255,255,${0.18+0.3*gl}),0 4px 20px rgba(0,0,0,.5)`}})}

// ---------- back layer: big words behind the person ----------
function buildBack(){BACKTEXT.forEach((b,i)=>{b.el=add('back',`<div class="giant" style="top:${b.top}px;font:800 ${b.size}px/1 IT,LOC;letter-spacing:-0.04em;color:${b.color||'#F7F2EA'}">${b.text}</div>`)})}
function drawBack(t){BACKTEXT.forEach(b=>{const on=t>=b.t0&&t<b.t1;b.el.style.display=on?'block':'none';if(!on)return;
  const [s,o]=pop(t,b.t0,0.5);const out=1-eo(P(t,b.t1-0.22,0.22));const g=b.glowAt?Math.max(0,1-Math.abs(t-b.glowAt)/0.5):0;
  b.el.style.transform=`scale(${b.t0<0.05?1.06-0.06*eo(P(t,0,2.2)):s})`;b.el.style.opacity=(b.t0<0.05?1:o)*out;
  b.el.style.textShadow=`0 0 ${30+50*g}px rgba(var(--accrgb),${0.12+0.5*g})`;if(g>0)b.el.style.color=`color-mix(in srgb, var(--acc) ${g*100}%, ${b.color||'#F7F2EA'})`})}

function renderFrame(t,f,mode){FR=f;const back=mode==='back';
  for(const el of $('stage').children){if(el.id!=='back')el.style.visibility=back?'hidden':'visible'}
  $('back').style.display=back?'block':'none';if(back){drawBack(t);return true}
  const card=BEATS.find(b=>b.card&&t>=b.t0&&t<b.t1);show($('card'),!!card);
  for(const b of BEATS){const el=$(b.card||b.layer);const on=t>=b.t0&&t<b.t1;show(el,on);if(on&&b.draw)b.draw(t,el)}
  if(card){const L=$(card.card);$('card').style.opacity=L.style.opacity===''?1:L.style.opacity;L.style.opacity=1}
  const p=drawPip(t);if(card&&+($('card').style.opacity)>0.99)show($('pipf'),0);
  $('shade').style.opacity=isFull(p.s)&&!card?1:0;
  const hl=$('hl');show(hl,HEADLINE.text&&t<HEADLINE.until+0.05);const ho=1-eo(P(t,HEADLINE.until-0.2,0.2));hl.style.opacity=ho;$('tshade').style.opacity=HEADLINE.text&&t<HEADLINE.until?ho:0;
  setCap(t);return true}
window.init=async function(cfg){CFG=cfg;SUBS=cfg.subs;$('hl').innerHTML=HEADLINE.text;buildBack();
  for(const b of BEATS){const id=b.card||b.layer;if(!$(id))add(b.card?'card':'layers',`<div class="layer" id="${id}"></div>`);if(b.build)b.build($(id))}
  for(const w of ['500','600','700','800'])await document.fonts.load(`${w} 100px IT`);
  for(const w of ['700','800'])await document.fonts.load(`${w} 100px LOC`,'മലയാളം हिन्दी தமிழ் عربي');
  await document.fonts.load('italic 100px IS');await document.fonts.load('500 30px JB');await document.fonts.ready;
  await Promise.all([...document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=r;im.onerror=r})));return true};
window.renderFrame=renderFrame;
</script></body></html>
