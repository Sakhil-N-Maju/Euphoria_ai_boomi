<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euphoria Editor</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e8eaef; --muted: #8b93a3; --accent: #ff7a45; --accent2: #ffb38f;
    --cut: #ff5d6c; --ok: #3ecf8e; --warn: #f5c451;
    --font: "Segoe UI", "Nirmala UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a0d06; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  a { color: var(--accent2); }
  .app { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .drop.over { border-color: var(--accent); background: #ff7a4510; }
  .drop .file { color: var(--muted); font-size: 12px; word-break: break-all; }
  .jobs { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .job { padding: 9px 11px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
  .job:hover { background: var(--panel2); }
  .job.sel { background: var(--panel2); border-color: var(--line); }
  .job .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .s { font-size: 12px; color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  main { padding: 22px 26px; min-width: 0; }
  .empty { color: var(--muted); margin-top: 18vh; text-align: center; }
  .top { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 22px; align-items: start; }
  video { width: 100%; max-height: 62vh; background: #000; border-radius: 12px; display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  label.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=range] { accent-color: var(--accent); width: 140px; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .muted { color: var(--muted); }
  .err { color: var(--cut); white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .transcript { margin-top: 20px; font-size: 17px; line-height: 2.05; user-select: text; }
  .transcript h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
  .w { padding: 2px 3px; border-radius: 5px; cursor: pointer; transition: background .1s; }
  .w:hover { background: var(--panel2); }
  .w.low { text-decoration: underline dotted var(--warn); text-underline-offset: 5px; }
  .w.cut { color: var(--cut); text-decoration: line-through; opacity: .75; }
  .w.filler.cut { background: #ff5d6c18; }
  .w.now { background: #ff7a4540; color: #fff; }
  .gap { display: inline-block; font-size: 11px; line-height: 1; padding: 3px 6px; margin: 0 3px; border-radius: 10px; background: #ff5d6c22; color: var(--cut); vertical-align: middle; cursor: default; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { font-style: normal; color: var(--cut); text-decoration: line-through; }
  .out { margin-top: 18px; }
  .w.retake.cut { background: #f5c45122; color: var(--warn); }
  .legend .rt { color: var(--warn); text-decoration: line-through; }
  .legend .kwl { color: var(--kw); font-weight: 650; } .legend .brl { box-shadow: inset 0 -2px 0 var(--br); }
  .note { color: var(--warn); font-size: 12px; margin-top: 8px; }
  .chat { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .chat h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 0; }
  .msgs { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
  .msg { padding: 8px 11px; border-radius: 10px; max-width: 92%; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #ff7a4522; }
  .msg.assistant { align-self: flex-start; background: var(--panel2); }
  .msg .sum { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .chat form { display: flex; gap: 8px; }
  .chat input[type=text] { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { font-size: 12px; padding: 4px 10px; border-radius: 14px; }
  /* finishing panels: style, b-roll, sound */
  :root { --kw: #FFD23F; --br: #5b8cff; }
  .fin { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  details.card > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::before { content: '▸'; color: var(--muted); transition: transform .15s; display: inline-block; }
  details.card[open] > summary::before { transform: rotate(90deg); }
  .skill { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 14px; align-items: start; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { color: var(--muted); font-size: 12px; }
  input.in, textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; color: var(--text); }
  textarea { width: 100%; resize: vertical; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  input[type=color] { width: 46px; height: 30px; padding: 0 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }
  .brow { border-top: 1px solid var(--line); padding: 12px 0 4px; display: grid; gap: 7px; }
  .brow .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .brow .head button, .brow .head select { font-size: 12px; padding: 4px 9px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); }
  .w.kw { color: var(--kw); font-weight: 650; }
  .w.br { box-shadow: inset 0 -2px 0 var(--br); }
  .w.fixed { text-decoration: underline dotted #6aa8ff; text-underline-offset: 5px; }
  .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .skill-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .skill-card.on { border-color: var(--accent); }
  .skill-card .by { color: var(--muted); font-size: 11px; }
  .skill-card .what { font-size: 13px; flex: 1; }
  .skill-card .row button { font-size: 12px; padding: 5px 10px; }
  .tb { color: var(--accent); font-weight: 700; margin: 0 2px 0 6px; }
  table.smap { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 8px; }
  table.smap td, table.smap th { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
  table.smap th { color: var(--muted); font-weight: 500; }
  .outs { display: flex; flex-direction: column; gap: 14px; }
  .tabs { display: flex; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 6px 4px; border-radius: 7px; font-size: 13px; }
  .tabs button.on { background: var(--accent); color: #1a0d06; font-weight: 600; }
  .view { display: flex; flex-direction: column; gap: 16px; max-width: 1100px; }
  .view h2 { font-size: 16px; margin: 0 0 4px; }
  .md { font-size: 14px; line-height: 1.6; overflow-x: auto; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; margin-top: 22px; } .md h3 { font-size: 15px; }
  .md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .md td, .md th { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .md code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .md pre { background: var(--panel2); padding: 10px; border-radius: 8px; white-space: pre-wrap; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .clip { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px; font-size: 12px; position: relative; }
  .clip video { max-height: 160px; border-radius: 6px; }
  .clip .x { position: absolute; top: 4px; right: 4px; padding: 1px 7px; font-size: 12px; }
  .sheet { width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .top { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>Euphoria <span>Editor</span></h1>
      <div class="sub">Talking-head videos, cut by the transcript</div>
    </div>
    <div class="tabs" id="tabs"><button data-mode="edit" class="on">Edit</button><button data-mode="montage" title="Beat-synced montage from clips + a song">Montage</button><button data-mode="grow" title="Starter kit, scripts">Grow</button><button data-mode="skills" title="Every skill as a switch">Skills</button></div>
    <div id="side-edit" style="display:flex;flex-direction:column;gap:18px">
    <form class="drop" id="drop">
      <div>Drop a video here or</div>
      <input type="file" id="file" accept="video/*" hidden>
      <button type="button" id="pick">Choose video</button>
      <div class="file" id="fname"></div>
      <div class="row" style="justify-content:center">
        <span class="muted">Language</span>
        <select id="lang"></select>
      </div>
      <button class="primary" id="upload" disabled>Upload &amp; transcribe</button>
      <div class="bar" id="upbar" hidden><div style="width:0"></div></div>
    </form>
    <div class="jobs" id="jobs"></div>
    </div>
    <div id="side-montage" style="display:none;flex-direction:column;gap:12px">
      <button class="primary" id="m-new">New montage</button>
      <div class="muted" style="font-size:12px">Clips + one song → a ~20 s beat-synced 9:16 reel.</div>
      <div class="jobs" id="mlist"></div>
    </div>
    <div id="side-grow" style="display:none;flex-direction:column;gap:12px">
      <button class="primary" id="g-home">Starter kit &amp; scripts</button>
      <div class="muted" style="font-size:12px">Saved files</div>
      <div class="jobs" id="glist"></div>
    </div>
  </aside>
  <main id="main"><div class="empty">Upload a talking-head video to get started.</div></main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, '0')}`; };
const BUSY = ['uploading', 'queued', 'transcribing', 'finding retakes', 'render queued', 'rendering'];
const LABEL = { uploading: 'Uploading', queued: 'Waiting', transcribing: 'Transcribing', 'finding retakes': 'Finding retakes (AI)', ready: 'Ready to review',
  'render queued': 'Waiting to render', rendering: 'Rendering', done: 'Rendered', error: 'Error' };

let languages = {}, jobsList = [], selected = null, state = null, previewEdit = true, saveTimer = null, ai = { configured: false };
let finishOpen = { style: true, broll: false, sound: false, publish: false };

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.json();
}

// ---------- upload ----------
const fileInput = $('#file'), drop = $('#drop');
$('#pick').onclick = () => fileInput.click();
fileInput.onchange = () => setFile(fileInput.files[0]);
['dragover', 'dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) setFile(f); });
let pending = null;
function setFile(f) { pending = f; $('#fname').textContent = f ? f.name : ''; $('#upload').disabled = !f; }
drop.onsubmit = ev => {
  ev.preventDefault();
  if (!pending) return;
  const fd = new FormData(); fd.append('file', pending); fd.append('language', $('#lang').value);
  const xhr = new XMLHttpRequest(), bar = $('#upbar');
  bar.hidden = false; $('#upload').disabled = true;
  xhr.upload.onprogress = e => { if (e.lengthComputable) bar.firstElementChild.style.width = (100 * e.loaded / e.total) + '%'; };
  xhr.onload = () => {
    bar.hidden = true; bar.firstElementChild.style.width = 0; setFile(null); fileInput.value = '';
    if (xhr.status === 200) { const m = JSON.parse(xhr.responseText); refreshJobs().then(() => select(m.id)); }
    else { alertMsg(JSON.parse(xhr.responseText || '{}').detail || 'Upload failed'); }
  };
  xhr.onerror = () => { bar.hidden = true; $('#upload').disabled = false; alertMsg('Upload failed'); };
  xhr.open('POST', '/api/jobs'); xhr.send(fd);
};
function alertMsg(m) { $('#fname').textContent = m; }

// ---------- job list ----------
async function refreshJobs() {
  jobsList = await api('/api/jobs');
  $('#jobs').innerHTML = jobsList.map(j => `
    <div class="job ${j.id === selected ? 'sel' : ''}" data-id="${j.id}">
      <div class="n">${esc(j.name)}</div>
      <div class="s">${LABEL[j.status] || j.status}${j.duration ? ' · ' + fmt(j.duration) : ''}</div>
      ${BUSY.includes(j.status) ? `<div class="bar"><div style="width:${Math.round((j.progress || 0) * 100)}%"></div></div>` : ''}
    </div>`).join('');
  $('#jobs').querySelectorAll('.job').forEach(el => el.onclick = () => select(el.dataset.id));
  if (selected && mode === 'edit') {
    const m = jobsList.find(j => j.id === selected);
    if (m && state && (m.status !== state.meta.status || BUSY.includes(m.status))) {
      const wasBusy = BUSY.includes(state.meta.status);
      state.meta = m;
      if (wasBusy && !BUSY.includes(m.status)) await select(selected, true); else renderStatus();
    }
  }
}

async function select(id, keepScroll) {
  selected = id;
  state = await api('/api/jobs/' + id);
  if (mode === 'skills') renderSkills(); else renderJob(keepScroll);
  refreshJobs();
}

// ---------- job view ----------
function renderJob() {
  const { meta, transcript, plan } = state;
  const main = $('#main');
  const lang = meta.detected_language ? (languages[meta.detected_language] || meta.detected_language) : '';
  main.innerHTML = `
    <div class="top">
      <div>
        <video id="video" controls preload="metadata" src="/api/jobs/${meta.id}/source"></video>
      </div>
      <div>
        <div class="card">
          <div class="stats">
            <div class="stat"><b id="st-orig">${fmt(plan ? plan.duration : meta.duration)}</b><span>original</span></div>
            <div class="stat"><b id="st-edit">${plan ? fmt(plan.edited_duration) : '–'}</b><span>after edit</span></div>
            <div class="stat"><b id="st-cuts">${plan ? plan.cuts.length : '–'}</b><span>cuts</span></div>
            <div class="stat"><b>${esc(lang || '–')}</b><span>language</span></div>
          </div>
          <div id="status" style="margin-top:12px"></div>
          ${plan ? `
          <div class="controls">
            <label class="chk"><input type="checkbox" id="o-sil" ${plan.settings.remove_silences ? 'checked' : ''}> Tighten pauses longer than
              <input type="range" id="o-min" min="0.3" max="2" step="0.1" value="${plan.settings.min_silence}"> <b id="o-min-v">${(+plan.settings.min_silence).toFixed(1)}s</b></label>
            <label class="chk"><input type="checkbox" id="o-cap" ${plan.captions.enabled !== false ? 'checked' : ''}> Burn in captions</label>
            <label class="chk"><input type="checkbox" id="o-prev" ${previewEdit ? 'checked' : ''}> Preview the edit in the player (skips cuts)</label>
          </div>
          <div class="actions">
            <button class="primary" id="render" title="Full resolution, final quality">Render final</button>
            <button id="draft" title="Low resolution, fast: check the edit before the final render">Draft (fast)</button>
            <button id="reset-fill" title="Cut every detected filler word">Cut fillers</button>
            <button id="restore" title="Bring back every word">Restore all words</button>
            <button id="retakes" title="AI finds sentences you said twice and keeps the last take" ${ai.configured ? '' : 'disabled'}>Find retakes</button>
            <button id="coach" title="3 notes on energy, pace and the first 3 seconds of this take" ${ai.configured ? '' : 'disabled'}>Coach this take</button>
            <button id="fixwords" title="AI fixes misheard names, numbers and English words; timings stay" ${ai.configured ? '' : 'disabled'}>Fix captions</button>
            ${state.has_fixes ? '<button id="restorewords" title="Undo the AI caption fixes">Restore original words</button>' : ''}
            <button id="shorts" title="AI finds 2-3 highlight clips and adds each as a new video" ${ai.configured ? '' : 'disabled'}>Find shorts</button>
            <button id="undo" title="Undo the last change" ${state.undo ? '' : 'disabled'}>Undo</button>
            <a href="/api/jobs/${meta.id}/edit.yaml" download>edit.yaml</a>
            <button id="del" style="margin-left:auto">Delete</button>
          </div>` : `<div class="actions"><button id="del">Delete</button></div>`}
        </div>
        ${plan ? `<div class="card chat" id="chat">
          <h3>Edit by typing ${ai.configured ? '' : '(add LLM_API_KEY=... to app\\.env then reload this page)'}</h3>
          <div class="msgs" id="msgs"></div>
          <div class="chips">
            <button type="button">Make a 30-second reel of the best part</button>
            <button type="button">Remove the part where I talk about price</button>
            <button type="button">Keep pauses a bit longer</button>
            <button type="button">Make the captions pop on keywords</button>
            <button type="button">Make the whoosh shorter and deeper</button>
          </div>
          <form id="chatform"><input type="text" id="chatin" placeholder="e.g. cut the intro, make it under 1 minute…" autocomplete="off" ${ai.configured ? '' : 'disabled'}>
            <button class="primary" id="chatsend" ${ai.configured ? '' : 'disabled'}>Send</button></form>
        </div>` : ''}
        <div class="out" id="out"></div>
      </div>
    </div>
    ${transcript ? `<div class="transcript card" id="tx">
      <h3>Transcript: click a word to cut it or bring it back; select several words to cut them together.</h3>
      <div id="words"></div>
      <div class="legend"><i>struck words</i> are cut · <span class="rt">yellow</span> = earlier take of a retake · red chips are pauses being tightened · dotted words were heard with low confidence<br>
        <b>Shift-click</b> a word to make it a <span class="kwl">keyword</span> that pops · <b>Alt-click</b> a word to start a new topic there (<span class="tb">¶</span> gets a transition) · <span class="brl">underlined</span> words are covered by b-roll</div>
    </div>` : ''}
    ${plan ? '<div class="fin" id="finish"></div>' : ''}`;

  $('#del').onclick = async () => {
    if (!confirm('Delete this video and its edit?')) return;
    try { await api('/api/jobs/' + meta.id, { method: 'DELETE' }); selected = null; state = null;
      $('#main').innerHTML = '<div class="empty">Deleted.</div>'; refreshJobs(); } catch (e) { alert(e.message); }
  };
  renderStatus();
  if (!plan) return;

  $('#o-sil').onchange = e => savePlan({ settings: { remove_silences: e.target.checked } });
  $('#o-min').oninput = e => { $('#o-min-v').textContent = (+e.target.value).toFixed(1) + 's'; };
  $('#o-min').onchange = e => savePlan({ settings: { min_silence: +e.target.value } });
  $('#o-cap').onchange = e => savePlan({ captions: { enabled: e.target.checked } });
  $('#o-prev').onchange = e => { previewEdit = e.target.checked; };
  $('#restore').onclick = () => savePlan({ removed_words: [] });
  $('#reset-fill').onclick = () => savePlan({ removed_words: [...new Set([...plan.removed_words, ...plan.filler_words])] });
  $('#undo').onclick = async () => {
    try { const r = await api(`/api/jobs/${meta.id}/undo`, { method: 'POST' }); setPlan(r.plan, r.undo, r.style, r.timeline); } catch (e) { alert(e.message); }
  };
  $('#fixwords').onclick = async () => {
    const b = $('#fixwords'); b.disabled = true; b.textContent = 'Checking words…';
    try { const r = await api(`/api/jobs/${meta.id}/fixwords`, { method: 'POST' }); state.transcript = r.transcript; state.chat = r.chat;
      state.has_fixes = state.has_fixes || r.fixes.length > 0; renderJob(); } catch (e) { alert(e.message); b.disabled = false; b.textContent = 'Fix captions'; }
  };
  if ($('#restorewords')) $('#restorewords').onclick = async () => {
    try { const r = await api(`/api/jobs/${meta.id}/restorewords`, { method: 'POST' }); state.transcript = r.transcript; state.has_fixes = false; renderJob(); } catch (e) { alert(e.message); }
  };
  $('#shorts').onclick = async () => {
    const b = $('#shorts'); b.disabled = true; b.textContent = 'Finding shorts…';
    try { const r = await api(`/api/jobs/${meta.id}/shorts`, { method: 'POST' }); await refreshJobs();
      addMsg('assistant', r.clips.length ? `Added ${r.clips.length} short${r.clips.length > 1 ? 's' : ''} to the list: ` + r.clips.map(c => `“${c.title}” (${c.seconds}s)`).join(', ') + '. Each is its own video you can style and render.' : 'No self-contained highlight clips found.'); }
    catch (e) { alert(e.message); }
    b.disabled = false; b.textContent = 'Find shorts';
  };
  $('#coach').onclick = async () => {
    const b = $('#coach'); b.disabled = true; b.textContent = 'Listening…';
    try { const r = await api(`/api/jobs/${meta.id}/coach`, { method: 'POST' }); state.chat = r.chat; renderChat(); }
    catch (e) { alert(e.message); }
    b.disabled = false; b.textContent = 'Coach this take';
  };
  $('#retakes').onclick = async () => {
    const b = $('#retakes'); b.disabled = true; b.textContent = 'Finding retakes…';
    try {
      const r = await api(`/api/jobs/${meta.id}/retakes`, { method: 'POST' });
      setPlan(r.plan, r.undo, r.style, r.timeline);
      addMsg('assistant', r.found.length ? `Found ${r.found.length} retake${r.found.length > 1 ? 's' : ''}: ` + r.found.map(x => x.reason).join('; ') + '. The earlier takes are cut (yellow); click a word to bring it back.' : 'No retakes found.');
    } catch (e) { alert(e.message); }
    b.disabled = false; b.textContent = 'Find retakes';
  };
  renderChat();
  $('#chatform').onsubmit = ev => { ev.preventDefault(); sendChat($('#chatin').value); };
  $('#chat').querySelectorAll('.chips button').forEach(b => b.onclick = () => { if (ai.configured) sendChat(b.textContent); else $('#chatin').value = b.textContent; });
  const startRender = draft => async () => {
    try { state.meta = await api(`/api/jobs/${meta.id}/render?draft=${draft}`, { method: 'POST' }); renderStatus(); refreshJobs(); }
    catch (e) { alert(e.message); }
  };
  $('#render').onclick = startRender(false);
  $('#draft').onclick = startRender(true);
  renderWords();
  renderFinishing();
  setupPlayer();
}

function renderStatus() {
  const { meta } = state, el = $('#status'), out = $('#out');
  if (!el) return;
  const busy = BUSY.includes(meta.status);
  const pct = Math.round((meta.progress || 0) * 100);
  const notes = [meta.stt_note, meta.retakes_error && ('Retake detection failed: ' + meta.retakes_error)].filter(Boolean)
    .map(n => `<div class="note">${esc(n)}</div>`).join('');
  el.innerHTML = notes + (meta.status === 'error' ? `<div class="err">${esc(meta.error || 'Something went wrong')}</div>`
    : busy ? `<div class="muted">${meta.status === 'rendering' && meta.render_kind === 'draft' ? 'Rendering draft' : LABEL[meta.status]}… ${pct}%${meta.status === 'transcribing' ? ' (the first video takes longer while the model loads)' : ''}</div>
              <div class="bar"><div style="width:${pct}%"></div></div>`
    : meta.status === 'ready' ? `<div class="muted">Review the cuts below, then render.${meta.stt_model ? ` <span title="speech-to-text model">· ${esc(meta.stt_model)}</span>` : ''}</div>` : '');
  const r = $('#render'); if (r) r.disabled = busy;
  const dr = $('#draft'); if (dr) dr.disabled = busy;
  if (!out) return;
  const cards = [];
  if (!busy && meta.rendered) cards.push(`
    <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">
      <b>Edited video</b><a href="/api/jobs/${meta.id}/output?download=true">Download MP4</a></div>
      <video controls preload="metadata" src="/api/jobs/${meta.id}/output?t=${meta.rendered || ''}"></video></div>`);
  if (!busy && meta.draft_rendered) cards.push(`
    <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">
      <b>Draft</b><span class="muted" style="font-size:12px">low resolution, for review</span></div>
      <video controls preload="metadata" src="/api/jobs/${meta.id}/draft?t=${meta.draft_rendered}"></video></div>`);
  out.innerHTML = cards.length ? `<div class="outs">${cards.join('')}</div>` : '';
}

function renderWords() {
  if (!$('#words')) return;
  const { transcript, plan } = state;
  const removed = new Set(plan.removed_words), fillers = new Set(plan.filler_words), retakes = new Set(plan.retake_words || []);
  const st = state.style || {}, kws = new Set(st.keywords || []), breaks = new Set(st.topic_breaks || []);
  const brw = new Map();
  (plan.broll || []).forEach((b, n) => { for (let i = b.from_word; i <= b.to_word; i++) brw.set(i, `b-roll ${n + 1}: ${b.show || ''}`); });
  const silenceCuts = plan.cuts.filter(c => c.reason.includes('silence'));
  const words = transcript.words;
  let html = '', ci = 0;
  const chip = c => `<span class="gap" title="${esc(c.reason)}: ${(c.end - c.start).toFixed(1)}s">⏸ ${(c.end - c.start).toFixed(1)}s</span>`;
  for (let k = 0; k < words.length; k++) {
    const w = words[k];
    while (ci < silenceCuts.length && silenceCuts[ci].end <= w.start + 0.05) { html += chip(silenceCuts[ci++]); }
    const cls = ['w', removed.has(w.i) && 'cut', fillers.has(w.i) && 'filler', retakes.has(w.i) && 'retake', w.prob < 0.5 && 'low',
      kws.has(w.i) && 'kw', brw.has(w.i) && 'br', w.orig_text && 'fixed'].filter(Boolean).join(' ');
    if (breaks.has(w.i)) html += '<span class="tb" title="New topic: transition here">¶</span>';
    const tip = [brw.get(w.i), w.orig_text && `heard as: ${w.orig_text}`].filter(Boolean).join(' · ');
    html += `<span class="${cls}" data-i="${w.i}" data-s="${w.start}"${tip ? ` title="${esc(tip)}"` : ''}>${esc(w.text)}</span> `;
  }
  while (ci < silenceCuts.length) html += chip(silenceCuts[ci++]);
  const box = $('#words');
  box.innerHTML = html || '<span class="muted">No speech was detected in this video.</span>';
  box.onmousedown = e => { if (e.shiftKey || e.altKey) e.preventDefault(); };
  box.onmouseup = e => {
    if (e.shiftKey || e.altKey) return;
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && box.contains(sel.anchorNode)) {
      const ids = [...box.querySelectorAll('.w')].filter(el => sel.containsNode(el, true)).map(el => +el.dataset.i);
      sel.removeAllRanges();
      if (ids.length > 1) { toggle(ids); return; }
    }
  };
  box.onclick = e => {
    const el = e.target.closest('.w');
    if (!el) return;
    if (e.shiftKey) { toggleStyleWord('keywords', +el.dataset.i); return; }
    if (e.altKey) { e.preventDefault(); toggleStyleWord('topic_breaks', +el.dataset.i); return; }
    if (window.getSelection().isCollapsed) toggle([+el.dataset.i]);
  };
}

function toggle(ids) {
  const removed = new Set(state.plan.removed_words);
  const allCut = ids.every(i => removed.has(i));
  ids.forEach(i => allCut ? removed.delete(i) : removed.add(i));
  state.plan.removed_words = [...removed].sort((a, b) => a - b);
  ids.forEach(i => { const el = document.querySelector(`.w[data-i="${i}"]`); if (el) el.classList.toggle('cut', !allCut); });
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => savePlan({ removed_words: state.plan.removed_words }), 350);
}

async function savePlan(body) {
  try {
    const plan = await api(`/api/jobs/${state.meta.id}/plan`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    setPlan(plan, plan._undo, plan._style, plan._timeline);
  } catch (e) { alert('Could not save: ' + e.message); }
}

function setPlan(plan, undoCount, style, timeline) {
  state.plan = plan;
  if (style) state.style = style;
  if (timeline) state.timeline = timeline;
  if (undoCount !== undefined) { state.undo = undoCount; const u = $('#undo'); if (u) u.disabled = !undoCount; }
  if (!$('#st-edit')) { if (mode === 'skills') renderSkills(); return; }
  $('#st-edit').textContent = fmt(plan.edited_duration);
  $('#st-cuts').textContent = plan.cuts.length;
  const sil = $('#o-sil'); if (sil) sil.checked = !!plan.settings.remove_silences;
  const mn = $('#o-min'); if (mn) { mn.value = plan.settings.min_silence; $('#o-min-v').textContent = (+plan.settings.min_silence).toFixed(1) + 's'; }
  const cap = $('#o-cap'); if (cap) cap.checked = plan.captions.enabled !== false;
  renderWords();
  renderFinishing();
}

// ---------- finishing: style (HyperFrames), b-roll (B-Roll Prompter), sound (Sound Design) ----------
function saveStyle(changes) { return savePlan({ style: changes }); }

function toggleStyleWord(key, i) {
  const cur = new Set((state.style || {})[key] || []);
  cur.has(i) ? cur.delete(i) : cur.add(i);
  const changes = { [key]: [...cur].sort((a, b) => a - b) };
  if (cur.has(i)) Object.assign(changes, key === 'keywords' ? { keyword_pop: true } : { transitions: true });
  saveStyle(changes);
}

function applyResp(r) { setPlan(r.plan, r.undo, r.style, r.timeline); if ('music' in r) { state.music = r.music; renderFinishing(); } }

async function upload(url, file) {
  const fd = new FormData(); fd.append('file', file);
  return api(url, { method: 'POST', body: fd });
}

// ---------- chat edits ----------
function addMsg(role, text, summary) {
  state.chat = state.chat || [];
  state.chat.push({ role, text, summary });
  renderChat();
}

function renderChat() {
  const box = $('#msgs');
  if (!box) return;
  const list = state.chat || [];
  box.innerHTML = list.length ? list.map(m => `<div class="msg ${m.role}">${esc(m.text)}${m.summary ? `<span class="sum">${esc(m.summary)}</span>` : ''}</div>`).join('')
    : `<div class="muted" style="font-size:12px">Tell the editor what to change, in Malayalam, Hindi or English. Every change can be undone.</div>`;
  box.scrollTop = box.scrollHeight;
}

async function sendChat(text) {
  text = (text || '').trim();
  if (!text) return;
  const input = $('#chatin'), send = $('#chatsend');
  input.value = ''; input.disabled = send.disabled = true;
  addMsg('user', text);
  addMsg('assistant', 'Thinking…');
  try {
    const r = await api(`/api/jobs/${state.meta.id}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
    state.chat = r.chat;
    setPlan(r.plan, r.undo, r.style, r.timeline);
    renderChat();
  } catch (e) {
    state.chat.pop(); addMsg('assistant', 'Sorry, that failed: ' + e.message);
  }
  input.disabled = send.disabled = false; input.focus();
}

// ---------- player: live preview of the edit + current-word highlight ----------
function setupPlayer() {
  const v = $('#video');
  let lastNow = null;
  const tick = () => {
    if (!document.body.contains(v)) return;
    const t = v.currentTime;
    if (previewEdit && !v.paused && state.plan) {
      const c = state.plan.cuts.find(c => t >= c.start && t < c.end - 0.02);
      if (c) v.currentTime = Math.min(c.end, v.duration || c.end);
    }
    const words = state.transcript.words;
    let lo = 0, hi = words.length - 1, idx = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (words[m].start <= t) { idx = m; lo = m + 1; } else hi = m - 1; }
    const now = idx >= 0 && t <= words[idx].end + 0.25 ? words[idx].i : null;
    if (now !== lastNow) {
      document.querySelectorAll('.w.now').forEach(el => el.classList.remove('now'));
      if (now !== null) document.querySelector(`.w[data-i="${now}"]`)?.classList.add('now');
      lastNow = now;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// tiny markdown renderer for the Grow files (headings, tables, lists, code, bold, links)
function md(text) {
  const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = String(text || '').split('\n'); let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let b = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) b += lines[i++] + '\n'; i++; out += `<pre>${esc(b)}</pre>`; continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^[\s|:-]+$/.test(r));
      out += '<table>' + body.map((r, k) => `<tr>${cells(r).map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join('')}</tr>`).join('') + '</table>'; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/); if (h) { out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ordered = /^\s*\d+\./.test(l); let items = '';
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items += `<li>${inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''))}</li>`;
      out += ordered ? `<ol>${items}</ol>` : `<ul>${items}</ul>`; continue; }
    if (/^>\s?/.test(l)) { out += `<blockquote class="muted">${inline(l.replace(/^>\s?/, ''))}</blockquote>`; i++; continue; }
    out += l.trim() ? `<p>${inline(l)}</p>` : ''; i++;
  }
  return out;
}

    <div class="actions"><button id="m-plan">Plan the edit</button><button id="m-draft" ${busy ? 'disabled' : ''}>Draft (fast)</button>
      <button class="primary" id="m-render" ${busy ? 'disabled' : ''}>Render</button>
      ${busy ? `<span class="muted">${esc(meta.status)}… ${Math.round((meta.progress || 0) * 100)}%</span>` : meta.status === 'error' ? `<span class="err">${esc(meta.error || '')}</span>` : ''}</div>
  </div>
  ${plan ? `<div class="card"><h2>Timeline (edit.json)</h2>
    <div class="muted" style="font-size:12px">${plan.bpm} BPM · ${plan.length.toFixed(1)} s from ${plan.song_start.toFixed(1)}s of the song · drop at ${plan.drop.toFixed(1)}s${meta.plan_stale ? ' · <span class="note">clips or song changed: re-plan</span>' : ''}${plan.unused_clips.length ? ' · not used: ' + esc(plan.unused_clips.join(', ')) : ''}</div>
    <table class="smap"><tr><th>#</th><th>Clip</th><th>Time</th><th>Source</th><th>Speed</th><th>Transition in</th><th></th></tr>
    ${plan.segments.map((s, k) => `<tr><td>${k + 1}</td><td>${esc(s.name)}</td><td>${s.start.toFixed(2)}–${s.end.toFixed(2)}s</td><td>${s.in.toFixed(1)}s +${s.span.toFixed(1)}s</td>
      <td>${s.speed[0] === s.speed[1] ? s.speed[0] + 'x' : s.speed[0] + 'x → ' + s.speed[1] + 'x'}</td><td>${{ fade: 'soft dissolve', hblur: 'focus blur', zoomin: 'zoom-through (drop)' }[s.transition_in] || 'focus-in open'}</td><td>${s.hero ? 'hero' : ''}</td></tr>`).join('')}</table>
    <div class="muted" style="font-size:12px;margin-top:6px">Effects: ${plan.sfx.map(e => `${SFX_NAMES[e.kind] || e.kind} at ${e.t.toFixed(2)}s`).join(', ') || 'none'} · music dips 4.5 dB under each.</div></div>` : ''}
  ${(meta.versions || []).slice().reverse().map(v => `<div class="card"><div class="row" style="justify-content:space-between"><b>Version ${v.v}${v.draft ? ' (draft)' : ''}</b>
      <span class="muted" style="font-size:12px">${v.length.toFixed(1)} s · grade ${esc(v.grade)} · <a href="${f(v.file)}?download=true">Download MP4</a></span></div>
      <div class="top" style="margin-top:10px"><video controls preload="metadata" src="${f(v.file)}"></video>
      <div><div class="muted" style="font-size:12px">Contact sheet, 4 frames per second: check for repeats, frozen frames and harsh transitions.</div><img class="sheet" src="${f(v.sheet)}"></div></div></div>`).join('')}
  <div class="card muted" style="font-size:12px">Not in this version of the skill: cut-out ride-ins, the wheel-portal zoom, the B&W clip band and the strip transition (they need a person/vehicle cut-out model).</div>
  </div>`;
  const post = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  $('#m-del').onclick = async () => { if (!confirm('Delete this montage and its files?')) return; await api('/api/montages/' + id, { method: 'DELETE' }); mstate = null; refreshMontages(); $('#main').innerHTML = montageIntro(); };
  $('#main').querySelectorAll('.clip .x').forEach(b => b.onclick = async () => { await api(`/api/montages/${id}/clips/${encodeURIComponent(b.dataset.f)}`, { method: 'DELETE' }); openMontage(id); });
  $('#m-addc').onclick = () => $('#m-cfile').click();
  $('#m-cfile').onchange = async e => { const files = [...e.target.files];
    for (let k = 0; k < files.length; k++) { $('#m-cstat').textContent = `Uploading and analysing ${k + 1} of ${files.length}…`;
      try { await upload(`/api/montages/${id}/clips`, files[k]); } catch (err) { alert(files[k].name + ': ' + err.message); } }
    openMontage(id); };
  $('#m-adds').onclick = () => $('#m-sfile').click();
  $('#m-sfile').onchange = async e => { const b = $('#m-adds'); b.disabled = true; b.textContent = 'Finding the beat…';
    try { await upload(`/api/montages/${id}/song`, e.target.files[0]); } catch (err) { alert(err.message); } openMontage(id); };
  $('#m-len').oninput = e => { $('#m-lenv').textContent = e.target.value + ' s'; };
  const replan = async () => { try { mstate = await post(`/api/montages/${id}/plan`, { length: +$('#m-len').value, grade: $('#m-grade').value }); renderMontage(); } catch (err) { alert(err.message); } };
  $('#m-plan').onclick = replan;
  $('#m-len').onchange = () => { if (plan) replan(); };
  $('#m-grade').onchange = replan;
  const go = draft => async () => { try { if (!plan || meta.plan_stale) await post(`/api/montages/${id}/plan`, { length: +$('#m-len').value, grade: $('#m-grade').value });
    await api(`/api/montages/${id}/render?draft=${draft}`, { method: 'POST' }); openMontage(id); } catch (err) { alert(err.message); } };
  $('#m-render').onclick = go(false); $('#m-draft').onclick = go(true);
}
setInterval(async () => {
  if (mode !== 'montage' || !mstate) return;
  if (!['render queued', 'rendering'].includes(mstate.meta.status)) return;
  try { mstate = await api('/api/montages/' + mstate.meta.id); renderMontage(); refreshMontages(); } catch {}
}, 2000);

// ---------- grow (Growth Starter + Viral Script) ----------
async function refreshGrow() {
  try { growFiles = (await api('/api/grow')).files; } catch { growFiles = []; }
  const label = { 'starter-kit': 'Starter kit', script: 'Script', style: 'Your voice (style.md)' };
  $('#glist').innerHTML = growFiles.map(g => `<div class="job" data-n="${esc(g.name)}"><div class="n">${label[g.kind] || g.kind}</div>
    <div class="s">${new Date(g.time * 1000).toLocaleString()}</div></div>`).join('') || '<div class="muted" style="font-size:12px">Nothing yet.</div>';
  $('#glist').querySelectorAll('.job').forEach(el => el.onclick = () => showGrowFile(el.dataset.n));
}
$('#g-home').onclick = () => growHome();
async function showGrowFile(name) {
  const text = await (await fetch('/api/grow/file/' + encodeURIComponent(name))).text();
  $('#main').innerHTML = `<div class="view"><div class="card"><div class="row" style="justify-content:space-between"><b>${esc(name)}</b>
    <span><button id="g-copy">Copy</button> <a href="/api/grow/file/${encodeURIComponent(name)}?download=true">Download .md</a></span></div>
    <div class="md">${md(text)}</div></div></div>`;
  $('#g-copy').onclick = () => navigator.clipboard.writeText(text).catch(() => {});
}
function growHome() {
  const q = (id, label, ph, rows = 2) => `<label class="field"><span>${label}</span><textarea class="in" id="${id}" rows="${rows}" placeholder="${esc(ph)}"></textarea></label>`;
  $('#main').innerHTML = `<div class="view">
  ${ai.configured ? '' : '<div class="card note">These tools need an API key: add LLM_API_KEY=... to app\\.env, then reload.</div>'}
  <div class="card"><h2>1 · Starter kit <span class="skill">Growth Starter</span></h2>
    <div class="muted" style="font-size:12px">Gets an account ready before the first reel: checks the topic has a big enough audience (TAM), a study list, bio A/B, picture brief, highlights, a 2-day warm-up and a week-1 plan.
    For the TAM check, search your topic on Instagram yourself (<code>instagram.com/explore/search/keyword/?q=your topic</code>, 3–5 phrasings, in English and your language) and paste what you see or attach screenshots. This app never logs into or acts on Instagram.</div>
    <div class="grid2">
      ${q('g1', '1. Who are you and what do you know well?', 'job, skill, business, life experience')}
      ${q('g2', '2. 2–3 topics you\'d like to make videos about', 'AI tools, cooking, exam tips…')}
      ${q('g3', '3. Who should watch?', 'normal people (mass) or a group: students, business owners, nurses abroad…')}
      ${q('g4', '4. Language of the videos', 'Malayalam, Hindi, English…', 1)}
      ${q('g5', '5. Face on camera or faceless?', '', 1)}
      ${q('g6', '6. What do you want from it?', 'followers, leads, a personal brand, sell something later')}
      ${q('g7', '7. Proof you can show + one free thing to give away', 'numbers, years, clients, results · a guide, template, checklist')}
      ${q('g8', 'Your current profile (optional)', 'name field, bio, highlights')}
      ${q('g9', 'What you found when searching your topic (optional)', 'reel links, creators, view counts, what the covers say', 3)}
      <label class="field"><span>Screenshots: your profile or search results (optional, up to 4)</span><input type="file" id="g-img" accept="image/*" multiple></label>
    </div>
    <div class="actions"><button class="primary" id="g-start" ${ai.configured ? '' : 'disabled'}>Write my starter kit</button><span class="muted" id="g-sstat"></span></div>
  </div>
  <div class="card"><h2>2 · Script from a reel that's working <span class="skill">Viral Script</span></h2>
    <div class="muted" style="font-size:12px">Find a reel in your topic with big views (300K+, or the top 10% for a small niche), screen-record it on your phone and upload it here, or paste its words.
    The script keeps its hook → structure → CTA and changes the words to yours. ${growFiles.some(g => g.kind === 'starter-kit') ? 'Your latest starter kit is used automatically.' : ''} ${growFiles.some(g => g.kind === 'style') ? 'Your saved voice (style.md) is used automatically.' : ''}</div>
    <div class="grid2">
      ${q('s1', 'Topic', 'what this reel is about')}
      ${q('s2', 'Audience', 'mass, or a specific group')}
      ${q('s3', 'Language of the script, and what stays in English', 'Malayalam; first hook line in English')}
      ${q('s5', 'CTA: comment keyword and what you give away', 'Comment GUIDE → free PDF')}
      ${q('s4', 'Your voice: 2–3 of your captions or scripts', 'paste a few so it sounds like you', 3)}
      <div class="field"><span>Reference reel: screen recording (it's transcribed here)</span>
        <div class="row"><input type="file" id="s-ref" accept="video/*,audio/*"><select id="s-lang">${Object.entries(languages).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></div>
        <span class="muted" id="s-rstat"></span></div>
      ${q('s6', 'Reference words with times (filled from the recording, or paste)', '[0.0s] Claude just killed…', 5)}
      ${q('s7', 'Reference notes: creator handle, link, views (mark estimates est.)', '@creator · instagram.com/reel/… · 1.2M views')}
    </div>
    <div class="actions"><button class="primary" id="g-script" ${ai.configured ? '' : 'disabled'}>Write my script</button><span class="muted" id="g-tstat"></span></div>
  </div></div>`;
  $('#g-start').onclick = async () => {
    const fd = new FormData();
    [['g1', 'about'], ['g2', 'topics'], ['g3', 'audience'], ['g4', 'language'], ['g5', 'face'], ['g6', 'goal'], ['g7', 'proof'], ['g8', 'profile'], ['g9', 'research']]
      .forEach(([id, k]) => fd.append(k, $('#' + id).value));
    [...$('#g-img').files].slice(0, 4).forEach(f => fd.append('images', f));
    const b = $('#g-start'); b.disabled = true; $('#g-sstat').textContent = 'Writing… (about a minute)';
    try { const r = await api('/api/grow/starter', { method: 'POST', body: fd }); await refreshGrow(); showGrowFile(r.name); }
    catch (e) { alert(e.message); b.disabled = false; $('#g-sstat').textContent = ''; }
  };
  $('#s-ref').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const fd = new FormData(); fd.append('file', file); fd.append('language', $('#s-lang').value);
    $('#s-rstat').textContent = 'Transcribing the reference…';
    try { const r = await api('/api/grow/reference', { method: 'POST', body: fd }); $('#s6').value = r.transcript; $('#s-rstat').textContent = `Done: ${Math.round(r.duration || 0)} s, ${r.language || ''}. Check the words and fix any mistakes.`; }
    catch (err) { $('#s-rstat').textContent = 'Failed: ' + err.message; }
  };
  $('#g-script').onclick = async () => {
    const body = { topic: $('#s1').value, audience: $('#s2').value, language: $('#s3').value, voice: $('#s4').value, cta: $('#s5').value, reference: $('#s6').value, notes: $('#s7').value };
    const b = $('#g-script'); b.disabled = true; $('#g-tstat').textContent = 'Writing… (about a minute)';
    try { const r = await api('/api/grow/script', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); await refreshGrow(); showGrowFile(r.name); }
    catch (e) { alert(e.message); b.disabled = false; $('#g-tstat').textContent = ''; }
  };
}

async function clickInEdit(sel, sec) {
  if (!selected) { alert('Open a video in the Edit list first.'); return; }
  if (sec) finishOpen[sec] = true;
  setMode('edit');
  for (let k = 0; k < 40 && !$(sel); k++) await new Promise(r => setTimeout(r, 100));
  const el = $(sel);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (el.tagName === 'BUTTON' && !sec) el.click(); }
}

function renderSkills() {
  const has = !!(selected && state && state.plan);
  const st = has ? (state.style || {}) : {};
  const groups = [...new Set(SKILLS.map(s => s.group))];
  const onCount = has ? SKILLS.filter(s => s.on && s.on(st)).length : 0;
  $('#main').innerHTML = `<div class="view">
    <div class="card"><h2>Skills</h2><div class="muted">${has ? `For <b>${esc(state.meta.name)}</b>: ${onCount} on. Switches apply to this video; render a draft to see them.` : 'Pick a video in the list to switch skills on for it. Montage and Grow work without one.'}</div></div>
    ${groups.map(g => `<div><h3 style="font-size:13px;color:var(--muted);margin:4px 0 8px">${g}</h3><div class="skills">
      ${SKILLS.map((sk, i) => [sk, i]).filter(([sk]) => sk.group === g).map(([sk, i]) => {
        const on = has && sk.on ? sk.on(st) : false;
        const needs = !sk.tab && !has;
        const btn = sk.set ? `<button data-i="${i}" data-act="toggle" class="${on ? '' : 'primary'}" ${needs ? 'disabled' : ''}>${on ? 'Turn off' : 'Turn on'}</button>`
          : sk.run ? `<button data-i="${i}" data-act="run" ${needs || !ai.configured ? 'disabled' : ''}>Run</button>`
          : `<button data-i="${i}" data-act="open" ${needs ? 'disabled' : ''}>Open</button>`;
        const pill = sk.on ? `<span class="pill ${on ? 'ok' : ''}">${has ? (on ? 'on' : 'off') : '–'}</span>` : `<span class="pill">${sk.tab ? 'tab' : 'tool'}</span>`;
        return `<div class="skill-card ${on ? 'on' : ''}"><div class="row" style="justify-content:space-between"><b>${esc(sk.name)}</b>${pill}</div>
          <div class="by">${esc(sk.by)}</div><div class="what">${esc(sk.what)}</div><div class="row">${btn}</div></div>`;
      }).join('')}</div></div>`).join('')}
  </div>`;
  $('#main').querySelectorAll('button[data-act]').forEach(b => b.onclick = async () => {
    const sk = SKILLS[+b.dataset.i];
    if (b.dataset.act === 'toggle') { b.disabled = true; await sk.set(!(sk.on && sk.on(state.style || {}))); renderSkills(); }
    else if (b.dataset.act === 'run') sk.run();
    else if (sk.tab) setMode(sk.tab);
    else clickInEdit(`details[data-sec="${sk.open}"]`, sk.open);
  });
}

// ---------- boot ----------
(async () => {
  languages = await api('/api/languages');
  try { ai = await api('/api/ai'); } catch {}
  $('#lang').innerHTML = Object.entries(languages).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('');
  await refreshJobs();
  if (jobsList.length) select(jobsList[0].id);
  setInterval(() => refreshJobs().catch(() => {}), 1500);
})();
